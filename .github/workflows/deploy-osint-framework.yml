name: Publish OSINT Framework on GitHub Pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-osint-framework.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout official OSINT Framework
        uses: actions/checkout@v4
        with:
          repository: lockfale/OSINT-Framework
          ref: master
          path: osint-upstream
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare OSINT Framework static files
        run: |
          npm ci --prefix osint-upstream
          cp -a osint-upstream/public/. .
          cp osint-upstream/LICENSE ./OSINT-Framework-LICENSE
          touch .nojekyll
          test -s index.html
          test -s js/arf.js
          test -s js/d3.min.js
          test -s css/arf.css
          test -s arf.json
      - name: Commit static website to main branch for branch-based GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html arf.json css js .nojekyll OSINT-Framework-LICENSE
          if git diff --cached --quiet; then
            echo "Already up to date."
          else
            git commit -m "Publish OSINT Framework website to repository root"
            git push origin HEAD:main
          fi
