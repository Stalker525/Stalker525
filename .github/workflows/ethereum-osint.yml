name: Export complete public ETH transactions
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/ethereum-osint.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and summarize Blockscout legacy public API
        run: |
          cat > /tmp/collect.py <<'PY'
          import csv,json,time,urllib.parse,urllib.request
          from decimal import Decimal
          from collections import defaultdict,Counter
          A='0x54e23bcc99e5a5818b382ac5bddda496e199aa6b'
          URL='https://eth.blockscout.com/api'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (public OSINT) Linux','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=40) as f:return json.load(f)
          def fetch(action):
            all=[];page=1
            while page <= 60:
              query={'module':'account','action':action,'address':A,'page':page,'offset':100,'sort':'asc','startblock':0,'endblock':99999999}
              url=URL+'?'+urllib.parse.urlencode(query)
              for retry in range(4):
                try:
                  j=get(url);break
                except Exception as e:
                  print('RETRY',action,page,retry,repr(e));time.sleep(2+retry*3)
              else: print('ERROR',action,'page',page);break
              v=j.get('result',[])
              if not isinstance(v,list):print('NONLIST',action,str(v)[:200]);break
              all.extend(v);print('PAGE',action,page,'rows',len(v))
              if len(v)<100:break
              page+=1;time.sleep(.8)
            return all
          txs=fetch('txlist')
          internal=fetch('txlistinternal')
          tokens=fetch('tokentx')
          paths=[('eth_transactions_full.csv',txs),('eth_internal_full.csv',internal),('eth_tokens_full.csv',tokens)]
          for path,rows in paths:
            headers=sorted({k for r in rows for k in r.keys()}) if rows else ['hash']
            with open(path,'w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,headers,extrasaction='ignore');w.writeheader();w.writerows(rows)
            print('EXPORT',path,'rows',len(rows))
          out=defaultdict(lambda:[0,Decimal(0)]);inc=defaultdict(lambda:[0,Decimal(0)])
          d=defaultdict(lambda:[0,0,Decimal(0),Decimal(0)])
          failed=0
          for t in txs:
            fr=str(t.get('from','')).lower();to=str(t.get('to','')).lower()
            val=Decimal(str(t.get('value') or 0))/Decimal(10)**18
            date=time.strftime('%Y-%m',time.gmtime(int(t.get('timeStamp',0))))
            if t.get('isError')=='1':failed+=1
            if fr==A.lower():out[to][0]+=1;out[to][1]+=val;d[date][0]+=1;d[date][2]+=val
            if to==A.lower():inc[fr][0]+=1;inc[fr][1]+=val;d[date][1]+=1;d[date][3]+=val
          rank=lambda d: sorted([{'address':k,'count':v[0],'ETH':str(v[1])} for k,v in d.items()],key=lambda v:v['count'],reverse=True)[:40]
          print('SUMMARY',json.dumps({'tx_count':len(txs),'internal_count':len(internal),'erc20_transfer_count':len(tokens),'failed':failed,'incoming_count':sum(v[0] for v in inc.values()),'outgoing_count':sum(v[0] for v in out.values()),'incoming_eth':str(sum(v[1] for v in inc.values())),'outgoing_eth':str(sum(v[1] for v in out.values())),'unique_incoming':len(inc),'unique_outgoing':len(out),'first':txs[0] if txs else None,'last':txs[-1] if txs else None,'top_out':rank(out),'top_in':rank(inc),'monthly':[{'month':k,'out_count':v[0],'in_count':v[1],'out_ETH':str(v[2]),'in_ETH':str(v[3])} for k,v in sorted(d.items())]},ensure_ascii=False))
          PY
          python /tmp/collect.py
      - name: Upload complete blockchain CSV files
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-eth-full-verified-export
          path: |
            eth_transactions_full.csv
            eth_internal_full.csv
            eth_tokens_full.csv
