name: Collect public Ethereum transactions (OSINT task)
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/ethereum-osint.yml]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Blockscout public API, summarize and export
        shell: bash
        run: |
          cat > /tmp/collect.py <<'PY'
          import csv, json, time, urllib.parse, urllib.request
          from collections import Counter,defaultdict
          from decimal import Decimal
          from datetime import datetime,timezone
          A="0x54e23bcc99e5a5818b382ac5bddda496e199aa6b"
          BASE="https://eth.blockscout.com/api/v2/addresses/"+A
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 OSINT-research/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req, timeout=35) as f: return json.load(f)
          data={}
          for section in ("transactions","internal-transactions","token-transfers"):
              items=[]; page=None; err=""
              for n in range(100):
                  url=BASE+"/"+section
                  if page: url+='?'+urllib.parse.urlencode(page)
                  try: result=get(url)
                  except Exception as e: err=repr(e);break
                  batch=result.get('items',[])
                  if not batch: break
                  items+=batch
                  page=result.get('next_page_params')
                  if not page:break
                  time.sleep(.5)
              data[section]=items
              print('RESULT',section,'count',len(items),'error',err)
          txs=data.get('transactions',[])
          fields=['hash','timestamp','from','to','value_eth','fee_eth','status','method','block']
          outgoing=defaultdict(lambda:[0,Decimal(0)]);incoming=defaultdict(lambda:[0,Decimal(0)])
          records=[]
          for t in txs:
              fr=(t.get('from') or {}).get('hash','')
              to=(t.get('to') or {}).get('hash','')
              val=Decimal(str(t.get('value') or 0))/Decimal(10)**18
              fee=t.get('fee',{})
              if isinstance(fee,dict):fee=fee.get('value','0')
              try:fe=Decimal(str(fee or '0'))/Decimal(10)**18
              except:fe=Decimal(0)
              h=t.get('hash','')
              rec={'hash':h,'timestamp':t.get('timestamp',''),'from':fr,'to':to,
                    'value_eth':str(val),'fee_eth':str(fe),'status':t.get('status',''),
                    'method':t.get('method',''),'block':t.get('block_number','')}
              records.append(rec)
              if fr.lower()==A.lower():outgoing[to][0]+=1;outgoing[to][1]+=val
              if to.lower()==A.lower():incoming[fr][0]+=1;incoming[fr][1]+=val
          with open('ethereum_transactions.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(records)
          for section in ('internal-transactions','token-transfers'):
              with open(section+'.json','w',encoding='utf-8') as f:json.dump(data[section],f,ensure_ascii=False,indent=1)
          for name,mapping in [('out',outgoing),('in',incoming)]:
              print('TOP',name,'COUNTERPARTIES',json.dumps(
                  sorted([(k,v[0],str(v[1])) for k,v in mapping.items()],key=lambda z:z[1],reverse=True)[:30]))
          print('TXCOUNT',len(records))
          print('SAMPLE_START',json.dumps(records[:3],ensure_ascii=False))
          print('SAMPLE_END',json.dumps(records[-3:],ensure_ascii=False))
          PY
          python /tmp/collect.py
      - name: Upload verified open-chain raw exports
        uses: actions/upload-artifact@v4
        with:
          name: public-ethereum-transactions
          path: |
            ethereum_transactions.csv
            internal-transactions.json
            token-transfers.json
